<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8f2fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a28" media="(prefers-color-scheme: dark)">
<title>Väder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<style>
:root{--bg:#e8f2fb;--card:#ffffff;--ink:#1a2433;--mut:#5a6b80;--line:#cfdcea;--acc:#2563d6;--accink:#ffffff;--helg:#ffd84d;--helgink:#3a2c00;--rain:#1f8fd1;--warm:#f08a24;--cold:#1f8fd1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a28;--card:#1a2638;--ink:#eaf1fb;--mut:#9fb1c8;--line:#2b3b52;--acc:#7aa8ff;--accink:#0a1a38;--helg:#e0b92f;--helgink:#241b00;--rain:#7cc4ff;--warm:#ffb15c;--cold:#7cc4ff}}
:root[data-theme="dark"]{--bg:#101a28;--card:#1a2638;--ink:#eaf1fb;--mut:#9fb1c8;--line:#2b3b52;--acc:#7aa8ff;--accink:#0a1a38;--helg:#e0b92f;--helgink:#241b00;--rain:#7cc4ff;--warm:#ffb15c;--cold:#7cc4ff}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -4px}
.place{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);box-shadow:0 2px 0 var(--line);overflow-x:auto;min-width:0;scrollbar-width:none}
.place[hidden]{display:none}
.chip{height:44px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--mut);font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:var(--acc);color:var(--accink);font-weight:800}
.icon-btn{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.dagrub{margin:26px 0 16px;font-size:.92rem;font-weight:700;color:var(--mut)}
.notice{background:var(--helg);color:var(--helgink);border-radius:20px;padding:12px 16px;font-size:.9rem;font-weight:600;margin-top:18px}
.kort{background:var(--card);border-radius:24px;box-shadow:0 2px 0 var(--line);padding:18px 20px;margin:0 0 14px}
.rub{margin:32px 4px 12px;font-size:.95rem;font-weight:800}
.hero{display:flex;align-items:center;gap:16px}
.hero .emoji{line-height:0}
.hero .emoji img{width:92px;height:92px}
.wxi{display:block;margin:0 auto}
.wxi{filter:drop-shadow(0 1px 1.5px rgba(26,36,51,.28))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wxi{filter:none}}
:root[data-theme="dark"] .wxi{filter:none}
.hero .temp{font-size:clamp(3.2rem,16vw,4.4rem);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--acc)}
.hero .desc{font-size:clamp(1.3rem,6vw,1.6rem);font-weight:600;line-height:1.15;margin-top:12px}
.hero .desc b{font-weight:800}
.feels{color:var(--mut);font-size:.9rem;font-weight:700;margin-top:6px}
.rutor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 4px}
.ruta{border-radius:22px;background:var(--card);box-shadow:0 2px 0 var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ruta .l{font-size:.82rem;font-weight:700;color:var(--mut)}
.ruta .v{font-size:1.5rem;font-weight:800;line-height:1}
.hours{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin}
.h{flex:none;width:60px;text-align:center;padding:10px 0;border-radius:18px}
.h.now{background:var(--acc);color:var(--accink)}
.h.now .t,.h.now .p{color:var(--accink)}
.h .t{font-size:.8rem;font-weight:700;color:var(--mut)}
.h .e{margin:4px 0}
.h .e img{width:36px;height:36px}
.h .d{font-weight:800}
.h .p{font-size:.75rem;font-weight:700;color:var(--rain);min-height:16px}
ul.dagar{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.day{display:grid;grid-template-columns:86px 34px 38px 1fr 38px;align-items:center;gap:8px;background:var(--card);border-radius:20px;box-shadow:inset 8px 0 0 var(--dc),0 2px 0 var(--line);padding:12px 16px 12px 22px}
.day .n{font-weight:800;line-height:1.2}
.day .n small{display:block;font-weight:400;color:var(--mut);font-size:.78rem}
.day .e img{width:38px;height:38px}
.day .lo{color:var(--mut);text-align:right;font-weight:600}
.day .hi{font-weight:800}
.range{height:8px;border-radius:999px;background:var(--line);position:relative}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--cold),var(--warm))}
.day .rain{grid-column:1/-1;font-size:.8rem;font-weight:700;color:var(--rain);margin-top:-2px;display:flex;align-items:center;gap:5px}
.day .rain svg{width:15px;height:15px;flex:none}
.helgbadge{display:inline-block;background:var(--helg);color:var(--helgink);border-radius:99px;padding:0 8px;font-size:.68rem;font-weight:800;margin-top:2px}
.sun{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}
.sun>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.sunikon{width:52px;height:52px;display:grid;place-items:center;margin-bottom:4px;color:#101a28}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sunikon{color:#fff}}
:root[data-theme="dark"] .sunikon{color:#fff}
.sunikon svg,.sunikon img{width:52px;height:52px;display:block}
.sun .v{font-size:1.25rem;font-weight:800;line-height:1.2}
.sun .l{font-size:.82rem;font-weight:700;color:var(--mut)}
.foot{text-align:center;font-size:.8rem;color:var(--mut);margin-top:24px}
.foot a{color:var(--mut)}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,440px);background:var(--card);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-weight:800}
dialog input{width:100%;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:11px 18px}
.res button{display:block;width:100%;text-align:left;border:0;background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 16px;margin-top:8px;cursor:pointer;font-weight:700}
.res small{color:var(--mut);font-weight:400}
.res p{color:var(--mut)}
.sek{margin-top:22px}
.sek h4{margin:0 0 8px;font-size:.95rem;font-weight:800}
.hint{color:var(--mut);font-size:.88rem;margin:0 0 8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--bg)}
.seg button{flex:1;height:40px;border:0;border-radius:999px;background:transparent;color:var(--mut);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.tom{text-align:center;padding:40px 10px}
.tom .e img{width:96px;height:96px}
.tom p{color:var(--mut);margin:8px 0 18px}
.saved{margin-top:4px}
.saved .rad span{font-weight:700}
.saved .ingen{color:var(--mut);padding:8px 0}
.saved .rad{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.saved .rad button{width:36px;height:36px;padding:0;border-radius:50%;flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.place{overflow:hidden}
.chip[data-i]{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 11px;font-size:14px}
.place:has(.plus){gap:2px;padding:3px}
.chip.plus{flex:none;width:42px;padding:0;font-size:22px;font-weight:800;line-height:1}
.res.fler button{margin-top:8px}
.res.fler button.vald{background:var(--acc);color:var(--accink)}
.laddar{color:var(--mut);font-weight:700;padding:14px 4px;list-style:none}
.snabbval{display:flex;flex-wrap:wrap;gap:6px}
.snabbval button{height:38px;padding:0 14px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.snabbval button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.datumval{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px;font-size:.9rem;font-weight:700;color:var(--mut)}
.datumval input{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:8px 14px;color-scheme:light dark}
.histhuvud{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.histikon img{width:64px;height:64px}
.histdatum{font-size:.9rem;font-weight:700;color:var(--mut)}
.histtxt{font-size:1.25rem;font-weight:800;line-height:1.2}
.histfakta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.histfakta>div{background:var(--bg);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.histfakta .l{font-size:.8rem;font-weight:700;color:var(--mut)}
.histfakta .v{font-size:1.1rem;font-weight:800}
.histfakta .nb{display:flex;align-items:center;gap:5px;color:var(--ink)}
.histfakta .nb svg{width:16px;height:16px;color:var(--rain)}
.histtimmar{margin-top:8px}
.close{margin-top:16px;width:100%;height:46px;border:0;border-radius:999px;background:var(--acc);color:var(--accink);font-weight:800;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="place" id="places"></div>
    <button class="icon-btn" id="setBtn" aria-label="Inställningar" title="Inställningar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div id="notice"></div>
  <div id="app"><div class="dagrub">Hämtar väder…</div></div>
  <div class="foot">Väderdata: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (bl.a. SMHI:s och MET Norways modeller)</div>
</main>

<dialog id="flerDlg">
  <h3>Fler orter</h3>
  <div class="res fler" id="flerLista"></div>
  <button class="close" id="flerStang" onclick="document.getElementById('flerDlg').close()">Stäng</button>
</dialog>

<dialog id="dlg">
  <h3>Inställningar</h3>
  <div class="sek">
    <h4>Mina orter</h4>
    <div class="saved" id="saved"></div>
  </div>
  <div class="sek">
    <h4>Lägg till ort</h4>
    <input id="q" placeholder="Skriv en ort, t.ex. Uppsala" autocomplete="off">
    <div class="res" id="res"></div>
  </div>
  <div class="sek">
    <h4>Tema</h4>
    <div class="seg" id="tema">
      <button type="button" data-t="auto">Auto</button>
      <button type="button" data-t="light">Ljust</button>
      <button type="button" data-t="dark">Mörkt</button>
    </div>
  </div>
  <button class="close" id="closeDlg">Klar</button>
</dialog>

<script>
// ---------- Grundinställningar ----------
const DEFAULT_PLACES = [{namn:'Stockholm',lat:59.3293,lon:18.0686}];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DAGAR = ['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r = n => Math.round(n);

// WMO-väderkoder → svensk text + emoji (dag/natt)
function wx(code, day=1){
  // Text + ikonfil (mappen ikoner/). Dag/natt-varianter där det finns.
  const D = (dag, natt) => day ? dag : natt;
  const T = {
    0:['Klart', D('day_clear','night_half_moon_clear')],
    1:['Mestadels klart', D('day_partial_cloud','night_half_moon_partial_cloud')],
    2:['Halvklart', D('day_partial_cloud','night_half_moon_partial_cloud')],
    3:['Mulet','overcast'],
    45:['Dimma','fog'], 48:['Rimfrost och dimma','fog'],
    51:['Lätt duggregn','rain'], 53:['Duggregn','rain'], 55:['Kraftigt duggregn','rain'],
    56:['Underkylt duggregn','sleet'], 57:['Underkylt duggregn','sleet'],
    61:['Lätt regn','rain'], 63:['Regn','rain'], 65:['Kraftigt regn','rain'],
    66:['Underkylt regn','sleet'], 67:['Underkylt regn','sleet'],
    71:['Lätt snöfall','snow'], 73:['Snöfall','snow'], 75:['Kraftigt snöfall','snow'], 77:['Snökorn','snow'],
    80:['Regnskurar', D('day_rain','night_half_moon_rain')], 81:['Regnskurar', D('day_rain','night_half_moon_rain')], 82:['Kraftiga skurar', D('day_rain','night_half_moon_rain')],
    85:['Snöbyar', D('day_snow','night_half_moon_snow')], 86:['Kraftiga snöbyar', D('day_snow','night_half_moon_snow')],
    95:['Åska','rain_thunder'], 96:['Åska med hagel','rain_thunder'], 99:['Åska med hagel','rain_thunder']
  };
  const [txt, fil] = T[code] || ['Okänt','cloudy'];
  return [txt, `<img class="wxi" src="ikoner/${fil}.svg" alt="${txt}">`];
}

// ---------- Platser (sparas i webbläsaren) ----------
let places, cur;
try{ const sp=localStorage.getItem('vader-orter'); places = sp!==null ? JSON.parse(sp) : DEFAULT_PLACES; }catch(e){ places = DEFAULT_PLACES; }
try{ cur = +localStorage.getItem('vader-vald') || 0; }catch(e){ cur = 0; }
if(cur>=places.length) cur=0;
function savePlaces(){ try{ localStorage.setItem('vader-orter',JSON.stringify(places)); localStorage.setItem('vader-vald',cur);}catch(e){} }

const MAX_SYNLIGA=3;
function valjOrt(i){ cur=i; savePlaces(); renderPlaces(); load(); }
function renderPlaces(){
  $('#places').hidden = !places.length;
  const synliga = places.slice(0,MAX_SYNLIGA);
  let html = synliga.map((p,i)=>`<button class="chip ${i===cur?'on':''}" data-i="${i}">${esc(p.namn)}</button>`).join('');
  if(places.length>MAX_SYNLIGA){
    // "+" är markerad när den valda orten ligger bland de dolda
    html += `<button class="chip plus ${cur>=MAX_SYNLIGA?'on':''}" id="flerBtn" aria-label="Fler orter" title="Fler orter">+</button>`;
  }
  $('#places').innerHTML = html;
  document.querySelectorAll('#places .chip[data-i]').forEach(b=>b.onclick=()=>valjOrt(+b.dataset.i));
  const fb=$('#flerBtn'); if(fb) fb.onclick=openFler;
}
function openFler(){
  $('#flerLista').innerHTML = places.map((p,i)=>i<MAX_SYNLIGA?'':`<button class="${i===cur?'vald':''}" data-i="${i}">${esc(p.namn)}</button>`).join('');
  document.querySelectorAll('#flerLista button').forEach(b=>b.onclick=()=>{ $('#flerDlg').close(); valjOrt(+b.dataset.i); });
  $('#flerDlg').showModal();
}

// ---------- Hämta väder ----------
async function fetchWeather(p){
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,precipitation,relative_humidity_2m,is_day'+
    '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,rain_sum,showers_sum,snowfall_sum,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max'+
    '&timezone=Europe%2FStockholm&wind_speed_unit=ms&forecast_days=10';
  const res = await fetch(url); if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
// Påhittat exempelväder (används när internet inte går att nå, t.ex. i förhandsvisningen)
function sampleWeather(){
  const now=new Date(); now.setMinutes(0,0,0);
  const hourly={time:[],temperature_2m:[],precipitation_probability:[],precipitation:[],weather_code:[],is_day:[]};
  const codes=[3,3,61,63,61,3,2,1,0,0,1,2,3,71,73,3,2,1,0,0,2,3,3,61];
  const start=new Date(now); start.setHours(0);
  for(let i=0;i<24*10;i++){
    const d=new Date(start.getTime()+i*36e5), h=d.getHours();
    hourly.time.push(isoDate(d)+'T'+pad(h)+':00');
    hourly.temperature_2m.push(+(3+3*Math.sin((h-9)/24*2*Math.PI)-i/120).toFixed(1));
    const c=codes[Math.floor(i/3)%codes.length]; hourly.weather_code.push(c);
    hourly.precipitation_probability.push([61,63,71,73].includes(c)?70:10);
    hourly.precipitation.push([61,63,71,73].includes(c)?0.6:0);
    hourly.is_day.push(h>=8&&h<16?1:0);
  }
  const daily={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],precipitation_sum:[],rain_sum:[],showers_sum:[],snowfall_sum:[],precipitation_probability_max:[],sunrise:[],sunset:[],wind_speed_10m_max:[]};
  const dc=[61,3,1,73,2,0,63,3,71,1];
  for(let i=0;i<10;i++){
    const d=new Date(start.getTime()+i*864e5), ds=isoDate(d);
    daily.time.push(ds); daily.weather_code.push(dc[i]);
    daily.temperature_2m_max.push(6-i*0.6); daily.temperature_2m_min.push(0-i*0.8);
    daily.precipitation_sum.push([61,63,71,73].includes(dc[i])?3.2:0);
    daily.rain_sum.push([61,63].includes(dc[i])?3.2:0); daily.showers_sum.push(0);
    daily.snowfall_sum.push([71,73].includes(dc[i])?2.2:0);
    daily.precipitation_probability_max.push([61,63,71,73].includes(dc[i])?80:10);
    daily.sunrise.push(ds+'T07:52'); daily.sunset.push(ds+'T15:21'); daily.wind_speed_10m_max.push(5+i%3);
  }
  const ci=hourly.time.indexOf(isoDate(now)+'T'+pad(now.getHours())+':00');
  return {sample:true,current:{temperature_2m:hourly.temperature_2m[ci],apparent_temperature:hourly.temperature_2m[ci]-3,weather_code:hourly.weather_code[ci],wind_speed_10m:4.2,wind_gusts_10m:9.1,precipitation:hourly.precipitation[ci],relative_humidity_2m:86,is_day:hourly.is_day[ci]},hourly,daily};
}

async function load(){
  const p=places[cur];
  if(!p){
    $('#notice').innerHTML='';
    $('#app').innerHTML=`<div class="tom"><div class="e"><img class="wxi" src="ikoner/day_partial_cloud.svg" alt=""></div><h2>Ingen ort vald</h2><p>Tryck på kugghjulet och lägg till en ort för att se vädret.</p><button class="close" style="width:auto;padding:0 24px" onclick="openSettings()">Öppna inställningar</button></div>`;
    return;
  }
  let data;
  try{ data = await fetchWeather(p); $('#notice').innerHTML=''; }
  catch(e){ data = sampleWeather(); $('#notice').innerHTML='<div class="notice">Kunde inte hämta riktigt väder – visar <b>påhittat exempelväder</b>. När appen ligger på GitHub Pages hämtas riktig data.</div>'; }
  render(p,data);
}

// ---------- Gemensamma ikoner och färger ----------
const IKON_DROPPE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c-.3 0-.6.2-.8.5C9 6.6 5.5 11.2 5.5 14.6a6.5 6.5 0 0 0 13 0c0-3.4-3.5-8-5.7-11.6-.2-.3-.5-.5-.8-.5z"/></svg>';
const IKON_SNO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10"/><path d="M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5M3.6 10.4l3.4-1-1-3.4M20.4 13.6l-3.4 1 1 3.4M6 17.4l1-3.4-3.4-1M18 6.6l-1 3.4 3.4 1"/></svg>';
const VECKODAG=['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
const FARG=['#e5484d','#f08a24','#e2b007','#2f9e5b','#1f8fd1','#6e56cf','#d6409f']; // mån–sön som i Mat
const dagFarg=ds=>FARG[(new Date(ds+'T12:00').getDay()+6)%7];

// ---------- Rita upp ----------
function render(p,d){
  const c=d.current, [txt,emo]=wx(c.weather_code,c.is_day);
  const now=new Date(), nowKey=isoDate(now)+'T'+pad(now.getHours())+':00';
  let hi=d.hourly.time.indexOf(nowKey); if(hi<0) hi=0;
  const hrs=[]; for(let i=hi;i<hi+24&&i<d.hourly.time.length;i++) hrs.push(i);

  const all=d.daily.temperature_2m_min.concat(d.daily.temperature_2m_max);
  const mn=Math.min(...all), mx=Math.max(...all), span=Math.max(mx-mn,1);
  const today=isoDate(now), tm=isoDate(new Date(now.getTime()+864e5));
  const dagNamn=ds=> ds===today?'Idag':ds===tm?'Imorgon':DAGAR[new Date(ds+'T12:00').getDay()];

  // Snö om minst hälften av nederbörden kommer som snö (eller koden säger snö om delarna saknas)
  const arSno=i=>{ const tot=d.daily.precipitation_sum[i]||0;
    if(d.daily.rain_sum&&d.daily.rain_sum[i]!=null){ const flytande=(d.daily.rain_sum[i]||0)+(d.daily.showers_sum?.[i]||0); return tot>0 && (tot-flytande)>=tot/2; }
    return [71,73,75,77,85,86].includes(d.daily.weather_code[i]); };
  const IKON_UPP='<svg viewBox="0 0 512 512" aria-hidden="true"><image href="ikoner/sol_halv.png" width="512" height="512"/><g fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"><path d="M264 225V50M200 112l64-64 64 64"/></g></svg>', IKON_NED='<svg viewBox="0 0 512 512" aria-hidden="true"><image href="ikoner/sol_halv.png" width="512" height="512"/><g fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"><path d="M264 40v175M200 153l64 64 64-64"/></g></svg>', IKON_LJUS='<img src="ikoner/day_clear.svg" alt="">';
  $('#app').innerHTML = `
  <div class="dagrub">${VECKODAG[now.getDay()]} ${today} · ${pad(now.getHours())}:${pad(now.getMinutes())}</div>
  <div class="kort">
    <div class="hero"><div class="emoji">${emo}</div><div class="temp">${r(c.temperature_2m)}°</div></div>
    <div class="desc">Just nu är det <b>${txt.toLowerCase()}</b> i ${esc(p.namn)}</div>
    <div class="feels">Känns som ${r(c.apparent_temperature)}° · Idag ${r(d.daily.temperature_2m_min[0])}° till ${r(d.daily.temperature_2m_max[0])}°</div>
  </div>

  <div class="rutor">
    <div class="ruta"><span class="l">Vind</span><span class="v">${c.wind_speed_10m.toFixed(0)} m/s</span><span class="l">Byar ${c.wind_gusts_10m.toFixed(0)} m/s</span></div>
    <div class="ruta"><span class="l">Nederbörd idag</span><span class="v">${(d.daily.precipitation_sum[0]||0).toFixed(1)} mm</span><span class="l">Luftfuktighet ${r(c.relative_humidity_2m)} %</span></div>
  </div>

  <h2 class="rub">Kommande 24 timmar</h2>
  <div class="kort" style="padding:12px 10px"><div class="hours">
    ${hrs.map((i,k)=>{const t=d.hourly.time[i].slice(11,13); const [,e]=wx(d.hourly.weather_code[i],d.hourly.is_day[i]); const pp=d.hourly.precipitation_probability[i];
      return `<div class="h ${k===0?'now':''}"><div class="t">${k===0?'Nu':t}</div><div class="e">${e}</div><div class="d">${r(d.hourly.temperature_2m[i])}°</div><div class="p">${pp>=20?pp+' %':''}</div></div>`;}).join('')}
  </div></div>

  <h2 class="rub">10 dagar</h2>
  <ul class="dagar">
    ${d.daily.time.map((ds,i)=>{const [t2,e]=wx(d.daily.weather_code[i],1); const lo=d.daily.temperature_2m_min[i], hi2=d.daily.temperature_2m_max[i];
      const left=(lo-mn)/span*100, w=(hi2-lo)/span*100; const ps=d.daily.precipitation_sum[i];
      const wd=new Date(ds+'T12:00').getDay(); const helg=wd===0||wd===6;
      return `<li class="day" style="--dc:${dagFarg(ds)}"><div class="n">${dagNamn(ds)}<small>${ds}</small></div><div class="e" title="${t2}">${e}</div>
      <div class="lo">${r(lo)}°</div><div class="range"><i style="left:${left}%;width:${Math.max(w,3)}%"></i></div><div class="hi">${r(hi2)}°</div>
      <div class="rain">${ps>=0.5?`${arSno(i)?IKON_SNO:IKON_DROPPE}<span>${ps.toFixed(1)} mm · ${d.daily.precipitation_probability_max[i]} % risk</span>`:'&nbsp;'}</div></li>`;}).join('')}
  </ul>

  <h2 class="rub">Solen</h2>
  <div class="kort"><div class="sun">
    <div><div class="sunikon">${IKON_UPP}</div><div class="v">${d.daily.sunrise[0].slice(11,16)}</div><div class="l">Soluppgång</div></div>
    <div><div class="sunikon">${IKON_NED}</div><div class="v">${d.daily.sunset[0].slice(11,16)}</div><div class="l">Solnedgång</div></div>
    <div><div class="sunikon">${IKON_LJUS}</div><div class="v">${dagsljus(d.daily.sunrise[0],d.daily.sunset[0])}</div><div class="l">Dagsljus</div></div>
  </div></div>

  <h2 class="rub">Senaste 7 dagarna</h2>
  <ul class="dagar" id="hist7"><li class="laddar">Hämtar…</li></ul>

  <h2 class="rub">Hur var vädret en viss dag?</h2>
  <div class="kort">
    <div class="snabbval" id="snabbval">
      <button type="button" data-ar="0" data-d="7">För en vecka sedan</button>
      <button type="button" data-ar="1">För 1 år sedan</button>
      <button type="button" data-ar="5">För 5 år sedan</button>
      <button type="button" data-ar="10">För 10 år sedan</button>
    </div>
    <label class="datumval">Eller välj datum <input type="date" id="histDatum" min="1940-01-01" max="${igar()}" value="${histVald}"></label>
    <div id="histDag"><div class="laddar">Hämtar…</div></div>
  </div>`;
  renderHistorik(p);
}

// ---------- Tillbaka i tiden ----------
// Data äldre än ca 80 dagar hämtas från Open-Meteos arkiv (ända tillbaka till 1940),
// nyare dagar från den vanliga väder-API:n (arkivet ligger några dagar efter).
const histCache = new Map();
const dagPlus = (ds,n) => { const t=new Date(ds+'T12:00'); t.setDate(t.getDate()+n); return isoDate(t); };
const igar = () => dagPlus(isoDate(new Date()),-1);
const arSedan = n => { const t=new Date(); t.setFullYear(t.getFullYear()-n); return isoDate(t); };
let histVald = arSedan(1);
let histSample = false;

async function hamtaPeriod(p,start,slut,medTimmar){
  const nyckel=[p.lat,p.lon,start,slut,medTimmar].join('|');
  if(histCache.has(nyckel)) return histCache.get(nyckel);
  const dagarSedan=(new Date(isoDate(new Date())+'T12:00')-new Date(start+'T12:00'))/864e5;
  const bas = dagarSedan<80 ? 'https://api.open-meteo.com/v1/forecast' : 'https://archive-api.open-meteo.com/v1/archive';
  const url = bas+'?latitude='+p.lat+'&longitude='+p.lon+'&start_date='+start+'&end_date='+slut+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max,sunshine_duration,sunrise,sunset'+
    (medTimmar?'&hourly=temperature_2m,weather_code,precipitation':'')+
    '&timezone=Europe%2FStockholm&wind_speed_unit=ms';
  let data;
  try{ const res=await fetch(url); if(!res.ok) throw new Error('HTTP '+res.status); data=await res.json(); histSample=false; }
  catch(e){ data=sampleHist(start,slut,medTimmar); histSample=true; }
  histCache.set(nyckel,data);
  return data;
}
// Påhittad historik när internet inte nås (förhandsvisningen)
function sampleHist(start,slut,medTimmar){
  const daily={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],precipitation_sum:[],snowfall_sum:[],wind_speed_10m_max:[],sunshine_duration:[],sunrise:[],sunset:[]};
  const koder=[3,61,2,71,0,63,1,45];
  for(let ds=start;ds<=slut;ds=dagPlus(ds,1)){
    const n=new Date(ds+'T12:00').getDate(), k=koder[n%koder.length];
    daily.time.push(ds); daily.weather_code.push(k);
    daily.temperature_2m_max.push(3+(n%5)); daily.temperature_2m_min.push(-3+(n%4));
    daily.precipitation_sum.push([61,63,71].includes(k)?2.4:0); daily.snowfall_sum.push(k===71?1.7:0);
    daily.wind_speed_10m_max.push(4+n%6); daily.sunshine_duration.push(k<=2?14400:3600);
    daily.sunrise.push(ds+'T07:50'); daily.sunset.push(ds+'T15:25');
  }
  const d={daily};
  if(medTimmar){
    d.hourly={time:[],temperature_2m:[],weather_code:[],precipitation:[]};
    for(let h=0;h<24;h++){ d.hourly.time.push(start+'T'+pad(h)+':00'); d.hourly.temperature_2m.push(+(daily.temperature_2m_min[0]+(daily.temperature_2m_max[0]-daily.temperature_2m_min[0])*Math.max(0,Math.sin((h-6)/24*2*Math.PI))).toFixed(1)); d.hourly.weather_code.push(daily.weather_code[0]); d.hourly.precipitation.push(daily.precipitation_sum[0]/24); }
  }
  return d;
}
// Snö om minst hälften av nederbörden föll som snö (1 cm snö ≈ 1,43 mm vatten)
function histSno(dd,i){ const tot=dd.precipitation_sum[i]||0, sno=(dd.snowfall_sum?.[i]||0)*10/7; return tot>0 && sno>=tot/2; }
function nedbordText(dd,i){
  const ps=dd.precipitation_sum[i]; if(ps==null) return '';
  return ps>=0.5 ? `${histSno(dd,i)?IKON_SNO:IKON_DROPPE}<span>${ps.toFixed(1)} mm</span>` : '';
}
const fmt = v => v==null ? '–' : r(v)+'°';

async function renderHistorik(p){
  // Senaste 7 dagarna
  const slut=igar(), start=dagPlus(slut,-6);
  const h7=await hamtaPeriod(p,start,slut,false);
  if(places[cur]!==p) return;
  const dd=h7.daily, idx=dd.time.map((_,i)=>i).reverse(); // nyast först
  const v=dd.temperature_2m_min.concat(dd.temperature_2m_max).filter(x=>x!=null);
  const mn=Math.min(...v), span=Math.max(Math.max(...v)-mn,1);
  const el7=$('#hist7');
  if(el7) el7.innerHTML = idx.map(i=>{
    const ds=dd.time[i], [t2,e]=wx(dd.weather_code[i],1), lo=dd.temperature_2m_min[i], hi=dd.temperature_2m_max[i];
    const namn = ds===slut ? 'Igår' : DAGAR[new Date(ds+'T12:00').getDay()];
    const bar = lo==null||hi==null ? '' : `<i style="left:${(lo-mn)/span*100}%;width:${Math.max((hi-lo)/span*100,3)}%"></i>`;
    return `<li class="day" style="--dc:${dagFarg(ds)}"><div class="n">${namn}<small>${ds}</small></div><div class="e" title="${t2}">${e}</div>
      <div class="lo">${fmt(lo)}</div><div class="range">${bar}</div><div class="hi">${fmt(hi)}</div>
      <div class="rain">${nedbordText(dd,i)||'&nbsp;'}</div></li>`;}).join('');
  if(histSample) visaHistNotis();

  // Snabbval + datumväljare
  document.querySelectorAll('#snabbval button').forEach(b=>b.onclick=()=>{
    histVald = b.dataset.d ? dagPlus(isoDate(new Date()),-b.dataset.d) : arSedan(+b.dataset.ar);
    $('#histDatum').value=histVald; visaDag(p);
  });
  $('#histDatum').onchange=e=>{ if(e.target.value){ histVald=e.target.value; visaDag(p); } };
  visaDag(p);
}

async function visaDag(p){
  const ds=histVald;
  document.querySelectorAll('#snabbval button').forEach(b=>{
    const m = b.dataset.d ? dagPlus(isoDate(new Date()),-b.dataset.d) : arSedan(+b.dataset.ar);
    b.setAttribute('aria-pressed', m===ds);
  });
  const ruta=$('#histDag'); if(!ruta) return;
  ruta.innerHTML='<div class="laddar">Hämtar…</div>';
  const h=await hamtaPeriod(p,ds,ds,true);
  if(places[cur]!==p || histVald!==ds || !$('#histDag')) return;
  const dd=h.daily;
  if(!dd || !dd.time || dd.temperature_2m_max[0]==null){ $('#histDag').innerHTML='<div class="laddar">Det finns ingen väderdata för den dagen ännu.</div>'; return; }
  const [txt,ikon]=wx(dd.weather_code[0],1);
  const wd=new Date(ds+'T12:00').getDay();
  const sol = dd.sunshine_duration?.[0]!=null ? (dd.sunshine_duration[0]/3600).toFixed(1).replace('.',',')+' h' : '–';
  const upp=dd.sunrise[0]?.slice(11,16), ned=dd.sunset[0]?.slice(11,16);
  const timmar = h.hourly ? h.hourly.time.map((t,i)=>{
    const hh=t.slice(11,13), dag = upp&&ned ? (t.slice(11,16)>=upp && t.slice(11,16)<ned) : true;
    const [,e]=wx(h.hourly.weather_code[i], dag?1:0); const pr=h.hourly.precipitation[i];
    return `<div class="h"><div class="t">${hh}</div><div class="e">${e}</div><div class="d">${fmt(h.hourly.temperature_2m[i])}</div><div class="p">${pr>=0.1?pr.toFixed(1)+' mm':''}</div></div>`;
  }).join('') : '';
  $('#histDag').innerHTML = `
    <div class="histhuvud"><div class="histikon">${ikon}</div>
      <div><div class="histdatum">${VECKODAG[wd]} ${ds}</div><div class="histtxt">${txt} i ${esc(p.namn)}</div></div></div>
    <div class="histfakta">
      <div><span class="l">Temperatur</span><span class="v">${fmt(dd.temperature_2m_min[0])} till ${fmt(dd.temperature_2m_max[0])}</span></div>
      <div><span class="l">Nederbörd</span><span class="v nb">${(dd.precipitation_sum[0]||0)>=0.5?(histSno(dd,0)?IKON_SNO:IKON_DROPPE):''}${(dd.precipitation_sum[0]||0).toFixed(1)} mm</span></div>
      <div><span class="l">Max vind</span><span class="v">${dd.wind_speed_10m_max[0]!=null?r(dd.wind_speed_10m_max[0])+' m/s':'–'}</span></div>
      <div><span class="l">Solsken</span><span class="v">${sol}</span></div>
    </div>
    ${timmar?`<div class="hours histtimmar">${timmar}</div>`:''}`;
  if(histSample) visaHistNotis();
}
function visaHistNotis(){
  if(!$('#notice').innerHTML) $('#notice').innerHTML='<div class="notice">Kunde inte hämta riktig historik – visar <b>påhittade exempeldata</b>. På GitHub Pages hämtas riktig data.</div>';
}

function dagsljus(a,b){ const m=(new Date(b)-new Date(a))/6e4; return `${Math.floor(m/60)} h ${pad(Math.round(m%60))} min`; }

// ---------- Inställningar ----------
const dlg=$('#dlg');
function renderSaved(){
  $('#saved').innerHTML = places.length
    ? places.map((p,i)=>`<div class="rad"><span>${esc(p.namn)}</span><button data-i="${i}" aria-label="Ta bort ${esc(p.namn)}" title="Ta bort">✕</button></div>`).join('')
    : '<div class="ingen">Inga orter sparade ännu.</div>';
  document.querySelectorAll('#saved button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; places.splice(i,1);
    if(cur>=places.length) cur=Math.max(places.length-1,0); else if(i<cur) cur--;
    savePlaces(); renderSaved(); renderPlaces(); load();
  });
}
function openSettings(){ $('#q').value=''; $('#res').innerHTML=''; renderSaved(); renderTema(); dlg.showModal(); }
$('#setBtn').onclick=openSettings;
$('#closeDlg').onclick=()=>dlg.close();

// Tema (Auto följer telefonens inställning)
function getTema(){ try{ return localStorage.getItem('vader-tema')||'auto'; }catch(e){ return 'auto'; } }
function setTema(t){
  if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('vader-tema',t); }catch(e){}
  renderTema();
}
function renderTema(){ const t=getTema(); document.querySelectorAll('#tema button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t)); }
document.querySelectorAll('#tema button').forEach(b=>b.onclick=()=>setTema(b.dataset.t));
setTema(getTema());
let timer;
$('#q').oninput=e=>{
  clearTimeout(timer); const q=e.target.value.trim(); if(q.length<2){$('#res').innerHTML='';return;}
  timer=setTimeout(async()=>{
    try{
      const res=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=sv&format=json&name='+encodeURIComponent(q));
      const j=await res.json(); const list=(j.results||[]);
      $('#res').innerHTML = list.length? list.map((x,i)=>`<button data-i="${i}">${esc(x.name)}<br><small>${esc([x.admin1,x.country].filter(Boolean).join(', '))}</small></button>`).join('') : '<p>Hittade ingen ort med det namnet.</p>';
      document.querySelectorAll('#res button').forEach(b=>b.onclick=()=>{const x=list[+b.dataset.i]; places.push({namn:x.name,lat:x.latitude,lon:x.longitude}); cur=places.length-1; savePlaces(); renderPlaces(); load(); $('#q').value=''; $('#res').innerHTML=''; renderSaved();});
    }catch(err){ $('#res').innerHTML='<p>Sökningen fungerar först när appen ligger på GitHub Pages (förhandsvisningen når inte internet).</p>'; }
  },350);
};

// ---------- Start ----------
renderPlaces(); load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(load, 30*60*1000); // uppdatera var 30:e minut
</script>
